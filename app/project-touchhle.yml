# Feature-only test app. A separate container preserves normal S5LBox machines.
include: project.yml
targets:
  S5LBox:
    sources:
      - path: ../third_party/touchhle/touchHLE_dylibs
        type: folder
        buildPhase: resources
      - path: ../third_party/touchhle/touchHLE_fonts
        type: folder
        buildPhase: resources
      - path: ../third_party/touchhle/touchHLE_default_options.txt
        buildPhase: resources
      - path: ../work/hle-guest-package/s5lbox-hle-launch.deb
        buildPhase: resources
    dependencies:
      - framework: ../work/touchhle-ios-target/aarch64-apple-ios/debug/libtouchHLE.a
        embed: false
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: SystemConfiguration.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j0shua.S5LBox.TouchHLETest
        S5LBOX_DISPLAY_NAME: S5LBox touchHLE
        GCC_PREPROCESSOR_DEFINITIONS:
          - S5LBOX_TOUCHHLE=1
