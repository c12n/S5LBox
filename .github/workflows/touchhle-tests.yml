name: touchhle-tests

on:
  push:
    paths:
      - 'third_party/touchhle/**'
      - 'integrations/touchhle-cpu/**'
      - 'core/**'
      - 'tools/guest_hle_files.*'
      - 'tools/test_guest_hle_files.py'
      - '.github/workflows/touchhle-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-files:
    name: Guest-owned live filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated file-service fixture
        run: |
          mkdir -p work/hle-files-tests
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -g \
            tools/guest_hle_files.c integrations/touchhle-cpu/fixtures/files_probe.c \
            -o work/hle-files-tests/files-probe
      - name: Verify chroot, privilege drop, live writes and real kernel locks
        run: sudo python3 tools/test_guest_hle_files.py work/hle-files-tests/files-probe
  ios-library:
    name: Interpreter library for iOS arm64
    needs: interpreter-runtime
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/touchhle-ios-target
      CARGO_BUILD_JOBS: '3'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CFLAGS: '-std=c11'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
      CMAKE_TOOLCHAIN_FILE_aarch64_apple_ios: ${{ github.workspace }}/third_party/touchhle/s5lbox-ios-arm64.cmake
    steps:
      - uses: actions/checkout@v4
      - name: Install the iOS Rust target
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios
      - name: Build the static library without code signing or JIT
        run: cargo +stable build --locked --manifest-path third_party/touchhle/Cargo.toml --target aarch64-apple-ios --lib
      - name: Verify the library architecture
        run: |
          set -euo pipefail
          archive=work/touchhle-ios-target/aarch64-apple-ios/debug/libtouchHLE.a
          test -s "$archive"
          xcrun lipo "$archive" -verify_arch arm64

      - name: Link a native iPhone host-boundary probe
        run: |
          set -euo pipefail
          mkdir -p work/ios-hle-probe
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c11 -Wall -Wextra -Werror \
            integrations/touchhle-cpu/fixtures/host_probe.c \
            work/touchhle-ios-target/aarch64-apple-ios/debug/libtouchHLE.a \
            -Wl,-dead_strip -lc++ -liconv -lz -framework Foundation -framework Security \
            -framework SystemConfiguration -framework AVFoundation -framework AudioToolbox \
            -framework CoreAudio -framework CoreBluetooth -framework CoreGraphics -framework CoreHaptics \
            -framework CoreMotion -framework CoreVideo -framework GameController \
            -framework OpenGLES -framework QuartzCore -framework UIKit -framework Metal \
            -o work/ios-hle-probe/hle-host-probe
          xcrun strip -S work/ios-hle-probe/hle-host-probe
          codesign --force --sign - --timestamp=none work/ios-hle-probe/hle-host-probe

      - name: Preserve the native test executable
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-ios-host-probe
          path: work/ios-hle-probe/hle-host-probe

      - name: Get the verified guest fixture
        uses: actions/download-artifact@v4
        with:
          name: touchhle-interpreter-smoke
          path: work/ios-hle-fixture

      - name: Package an ordinary UIKit runtime test host
        run: |
          set -euo pipefail
          app=work/ios-hle-app/Payload/HLEProbe.app
          mkdir -p "$app"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$sdk" -std=c11 -Wall -Wextra -Werror -Dmain=s5lbox_hle_fixture_main \
            -c integrations/touchhle-cpu/fixtures/host_probe.c -o work/ios-hle-app/host-probe.o
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$sdk" -fobjc-arc -Wall -Wextra -Werror \
            integrations/touchhle-cpu/fixtures/ios_probe.m work/ios-hle-app/host-probe.o \
            work/touchhle-ios-target/aarch64-apple-ios/debug/libtouchHLE.a \
            -Wl,-dead_strip -lc++ -liconv -lz -framework Foundation -framework Security \
            -framework SystemConfiguration -framework AVFoundation -framework AudioToolbox \
            -framework CoreAudio -framework CoreBluetooth -framework CoreGraphics -framework CoreHaptics \
            -framework CoreMotion -framework CoreVideo -framework GameController \
            -framework OpenGLES -framework QuartzCore -framework UIKit -framework Metal \
            -o "$app/HLEProbe"
          cp integrations/touchhle-cpu/fixtures/ios-probe.plist "$app/Info.plist"
          cp -R work/ios-hle-fixture/hle-smoke/InterpreterSmoke.app "$app/"
          cp -R third_party/touchhle/touchHLE_dylibs third_party/touchhle/touchHLE_fonts "$app/"
          cp third_party/touchhle/touchHLE_default_options.txt "$app/"
          xcrun strip -S "$app/HLEProbe"
          codesign --force --sign - --timestamp=none "$app/InterpreterSmoke.app"
          codesign --force --sign - --timestamp=none --entitlements app/S5LBox.entitlements "$app"
          codesign --verify --strict "$app"
          cd work/ios-hle-app
          zip -qry HLEProbe.ipa Payload

      - name: Preserve the UIKit test host
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-ios-test-app
          path: work/ios-hle-app/HLEProbe.ipa

  interpreter-runtime:
    name: Rust frameworks with the C interpreter
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/touchhle-target
      CARGO_BUILD_JOBS: '3'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CFLAGS: '-std=c11'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check interpreter-only dependency graph
        run: |
          set -euo pipefail
          cargo +stable tree --locked --manifest-path third_party/touchhle/Cargo.toml --edges normal > dependencies.txt
          if grep -i dynarmic dependencies.txt; then
            echo 'The interpreter build must not depend on Dynarmic.' >&2
            exit 1
          fi

      - name: Test the integrated Rust library
        run: cargo +stable test --locked --manifest-path third_party/touchhle/Cargo.toml --lib -- --test-threads=1

      - name: Build the headless runtime
        run: cargo +stable build --locked --manifest-path third_party/touchhle/Cargo.toml --bin touchHLE

      - name: Fetch the pinned community test SDK
        run: |
          set -euo pipefail
          mkdir -p work/hle-sdk
          curl -fL --retry 3 https://github.com/touchHLE/common-3.0-sdk/releases/download/v0.3.7/common-3.0.sdk-macOS-universal.tar.gz -o work/hle-sdk/sdk.tar.gz
          tar -xzf work/hle-sdk/sdk.tar.gz -C work/hle-sdk

      - name: Build the ARM and Thumb test app
        shell: pwsh
        run: |
          $clang=(xcrun --find clang).Trim()
          ./integrations/touchhle-cpu/fixtures/build.ps1 -Clang $clang -SDK work/hle-sdk/common-3.0.sdk -OutputDirectory (Join-Path $PWD 'work/hle-smoke')

      - name: Run a real Mach-O app through the interpreter and frameworks
        working-directory: third_party/touchhle
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ../../work/touchhle-target/debug/touchHLE ../../work/hle-smoke/InterpreterSmoke.app --headless > ../../work/hle-smoke.log 2>&1
          cat ../../work/hle-smoke.log
          grep -F 'S5LBOX-HLE-SMOKE PASS failures=0' ../../work/hle-smoke.log

      - name: Preserve smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-interpreter-smoke
          path: |
            work/hle-smoke.log
            work/hle-smoke/InterpreterSmoke.app
          if-no-files-found: ignore

      - name: Reuse one host process after guest exits and faults
        working-directory: third_party/touchhle
        timeout-minutes: 3
        env:
          S5LBOX_HLE_SMOKE_APP: ${{ github.workspace }}/work/hle-smoke/InterpreterSmoke.app
        run: |
          set -euo pipefail
          cargo +stable test --locked --test runtime_lifecycle -- --ignored --nocapture --test-threads=1 > ../../work/hle-lifecycle.log 2>&1
          cat ../../work/hle-lifecycle.log
          grep -F 'S5LBOX-HLE-LIFECYCLE PASS' ../../work/hle-lifecycle.log

      - name: Verify the host ABI and responsive stop controls
        working-directory: third_party/touchhle
        timeout-minutes: 3
        env:
          S5LBOX_HLE_SMOKE_APP: ${{ github.workspace }}/work/hle-smoke/InterpreterSmoke.app
        run: |
          set -euo pipefail
          cargo +stable test --locked --test host_boundary -- --ignored --nocapture --test-threads=1 > ../../work/hle-host.log 2>&1
          cat ../../work/hle-host.log
          grep -F 'S5LBOX-HLE-HOST PASS' ../../work/hle-host.log

      - name: Preserve lifecycle-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-interpreter-lifecycle
          path: |
            work/hle-lifecycle.log
            work/hle-host.log
          if-no-files-found: ignore
